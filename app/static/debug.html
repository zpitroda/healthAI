<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>healthAI // Debug & Logging Workbench</title>
    <link rel="stylesheet" href="/static/css/debug.css" />
</head>
<body>
    <header>
        <div class="header-title">
            <h1>healthAI // Debug & Logging</h1>
            <div id="ws-status" class="status-badge disconnected">
                <span class="status-dot"></span>
                <span id="ws-status-text">Disconnected</span>
            </div>
        </div>
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation menu">
            <span>☰</span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a href="/">Safety Lab</a>
            <a href="/graph">Knowledge Graph</a>
            <a href="/compound?key=caffeine">Compound DB</a>
            <a href="/admin">Catalog DB</a>
            <a href="/debug" class="active">Debug Workbench</a>
        </nav>
    </header>

    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div>
                <div class="section-title">System Health & Telemetry</div>
                <div class="card">
                    <div class="info-group">
                        <span class="info-label">RAM (RSS):</span>
                        <span id="sys-ram" class="info-val">-- MB</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">SQLite:</span>
                        <span id="sys-sqlite" class="info-val">--</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Neo4j:</span>
                        <span id="sys-neo4j" class="info-val">--</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Buffered Logs:</span>
                        <span id="sys-log-count" class="info-val">0</span>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">Logger Level Controller</div>
                <div class="card control-group">
                    <label for="logger-select">Select Logger:</label>
                    <select id="logger-select">
                        <option value="root">root (Global)</option>
                    </select>

                    <label for="logger-level-select">New Log Level:</label>
                    <select id="logger-level-select">
                        <option value="DEBUG">DEBUG</option>
                        <option value="INFO">INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>

                    <button id="btn-apply-level">Apply Level</button>
                </div>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="workspace">
            <div class="tabs">
                <div class="tab active" data-tab="tab-logs">Live Log Stream</div>
                <div class="tab" data-tab="tab-eval">Interactive Eval Sandbox</div>
            </div>

            <!-- Tab 1: Logs -->
            <div id="tab-logs" class="tab-content active">
                <div class="log-toolbar">
                    <select id="filter-level" style="width: 130px;">
                        <option value="">All Levels</option>
                        <option value="DEBUG">DEBUG</option>
                        <option value="INFO">INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>
                    <input type="text" id="filter-search" placeholder="Search log text or logger name...">
                    <button id="btn-refresh-logs" class="btn-secondary">Refresh</button>
                    <button id="btn-clear-logs" class="btn-danger">Clear Buffer</button>
                </div>
                <div id="log-container" class="log-container">
                    <div style="color: #6b7280;">Connecting to log stream...</div>
                </div>
            </div>

            <!-- Tab 2: Interactive Eval Sandbox -->
            <div id="tab-eval" class="tab-content">
                <div style="margin-bottom: 12px; display: flex; gap: 12px; align-items: center;">
                    <label for="eval-type-select" style="font-weight: 600;">Eval Target Engine:</label>
                    <select id="eval-type-select" style="width: 220px;">
                        <option value="collision">Collision Matrix</option>
                        <option value="pkpd">PBPK / ODE Simulation</option>
                        <option value="catalog">Catalog Compound Search</option>
                        <option value="graph">Neo4j / Cypher Query</option>
                        <option value="snippet">Python Code Sandbox</option>
                    </select>
                    <button id="btn-run-eval">Execute Eval</button>
                </div>

                <div class="sandbox-grid">
                    <div class="sandbox-pane">
                        <label id="eval-input-label">Payload Input (JSON / Code):</label>
                        <textarea id="eval-input-code" spellcheck="false"></textarea>
                    </div>
                    <div class="sandbox-pane">
                        <label>Execution Output & Response:</label>
                        <div id="eval-result-output" class="result-box">Ready to execute.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/debug.js"></script>
</body>
</html>
