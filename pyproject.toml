[project]
name = "healthai"
version = "2.0.0"
description = "Science-driven pharmacology lab & individualized protocol engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "networkx>=3.3",
    "httpx>=0.27.0",
    "neo4j>=5.28.0",
    "python-multipart>=0.0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
